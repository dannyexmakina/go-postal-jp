version: '3.4'
services:
    postal:
        build: ./docker/front/
        container_name: postal
        volumes:
            - ./docker/front/root/cli:/root/cli
            - $GOPATH/src/gitlab.flama.jp/go:/var/go/src/gitlab.flama.jp/go
            - ../../db:/var/shared
        environment:
            - TZ=Asia/Tokyo
